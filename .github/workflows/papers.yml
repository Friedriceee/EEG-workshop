name: papers

on:
  pull_request:
    paths: ["papers/**", "scripts/build_paper_index.py"]
  push:
    branches: [main]
    paths: ["papers/*.md", "scripts/build_paper_index.py"]

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build_paper_index.py --check

  index:
    # 合并到 main 后自动重新生成 papers/INDEX.md,大家不用手动维护
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build_paper_index.py
      - name: Commit index
        run: |
          if ! git diff --quiet papers/INDEX.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add papers/INDEX.md
            git commit -m "papers: update INDEX.md [skip ci]"
            git push
          fi
